name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of mod_version from main
        type: boolean
        default: false
      notes:
        description: Release notes (generated from pull requests if empty)
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon --configure-on-demand :${{ matrix.minecraft }}:assemble
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: spyglass-scroll-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: spyglass-scroll-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            gh release create "$TAG" dist/*.jar --verify-tag --title "$TAG" --generate-notes
          else
            # Manual run: tag the current commit with the version that was built.
            TAG=v$(sed -n 's/^mod_version=//p' gradle.properties)
            if [[ -n $NOTES ]]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "$TAG" "${notes[@]}"
          fi
